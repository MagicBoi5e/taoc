      overflow: hidden;
      pointer-events: none;
      z-index: 1002;

    --carve-font: "Amatic SC", cursive;
    --background: oklch(0.2 0.02 60);
    --foreground: oklch(0.93 0.03 80);
    --carve-deep: oklch(0.18 0.03 50);
    --nail: oklch(0.35 0.03 50);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--background); color: var(--foreground); overflow: hidden; }

  /* Hide the scene until the fog starts clearing. */
  .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 1; /* Temporarily keep the video visible for testing */
  }

  .video-bg iframe {
      pointer-events: none;
  }

  .video-vignette {
      z-index: 1;
      opacity: 0;
      transition: opacity 3s ease;
  }

    /* Intro Overlay */

  .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 1003;
      display: grid;
      place-items: center;
      background: transparent;
      transition: opacity 1s ease;
  }

  #enterButton {
      position: relative;
      width: min(85vw, 1000px);
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
      z-index: 1;
  }

  #enterButton img {
      display: block;
      width: 100%;
      height: auto;
  }

  #enterButton:hover {
      transform: scale(1.03);
      filter: brightness(1.15);
  }

  #enterButton.leaving {
      animation: logoFadeIntoFog 3s ease-in forwards;
      pointer-events: none;
  }

  .intro-overlay.leaving {
      animation: logoFadeIntoFog 3s ease-in forwards;
  }

  @keyframes logoFadeIntoFog {
      0% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
      }

      50% {
          opacity: 0.6;
          transform: scale(1.04);
          filter: blur(4px);
      }

      100% {
          opacity: 0;
          transform: scale(1.1);
          filter: blur(12px);
      }
  }

  .fog-container.enveloping {
      z-index: 1004;
      animation: fogEnvelop 3s ease-in forwards;
  }

  @keyframes fogEnvelop {
    0% {
        filter: brightness(1);
        opacity: 1;
    }

    45% {
        filter: brightness(1.8);
        opacity: 1;
    }

    100% {
        filter: brightness(1.5);
        opacity: 1;
    }
}

  .fog-container.leaving {
      opacity: 0;
      pointer-events: none;
  }

  .signpost {
      z-index: 2;
      opacity: 0;
      transition: opacity 3s ease;
  }

  body.entered .video-bg,
  body.entered .video-vignette,
  body.entered .signpost {
      opacity: 1;
  }

  .video-bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .video-bg iframe {
    position: absolute; top: 50%; left: 50%; border: 0;
    width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.78vh;
    transform: translate(-50%, -50%) scale(1.15);
  }
  .video-vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, oklch(0 0 0 / 0.55)); }

  .signpost { position: absolute; left: max(19%, 260px); bottom: 0; transform: translateX(-50%);
    height: 88vh; width: min(90vw, 520px); display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 1.4rem; padding-top: 4vh; }
  .pole { position: absolute; left: 50%; top: 2vh; bottom: 0; width: 46px; transform: translateX(-50%);
    background-image: var(--pole-img); background-size: cover; background-position: center; border-radius: 6px 6px 0 0;
    box-shadow: inset -10px 0 18px oklch(0 0 0 / 0.6), inset 6px 0 10px oklch(1 0 0 / 0.08), 8px 0 25px oklch(0 0 0 / 0.5);
    filter: brightness(0.6) saturate(0.45) contrast(0.85) blur(0.3px); }
  .pole-cap { position: absolute; left: 50%; top: calc(2vh - 10px); width: 58px; height: 14px; transform: translateX(-50%);
    background-image: var(--pole-img); background-size: cover; background-position: center; border-radius: 4px; filter: brightness(0.5) saturate(0.45) contrast(0.85) blur(0.3px);
    box-shadow: 0 4px 8px oklch(0 0 0 / 0.6); }

  .plank { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    width: 440px; height: 84px; background-image: var(--wood-img); background-size: cover; background-position: center; text-decoration: none;
    transform: rotate(var(--tilt)); transition: transform .35s cubic-bezier(.3,1.6,.5,1), filter .3s;
    filter: brightness(0.5) saturate(0.4) contrast(0.85) blur(0.3px);
    box-shadow: inset 0 3px 3px oklch(1 0 0 / 0.18), inset 0 -6px 10px oklch(0 0 0 / 0.55), 0 14px 22px oklch(0 0 0 / 0.55); }
  .plank-right { margin-left: 210px; clip-path: polygon(0 4%, 82% 0, 100% 50%, 83% 100%, 1% 96%, 2% 50%); padding-right: 56px; }
  .plank-left { margin-right: 210px; clip-path: polygon(18% 0, 99% 5%, 98% 52%, 100% 95%, 17% 100%, 0 50%); padding-left: 56px; }
  .plank:hover, .plank:focus-visible { outline: none; filter: brightness(0.75) saturate(0.6) contrast(0.95) blur(0.3px);
    transform: rotate(calc(var(--tilt) * -0.5)) scale(1.06); }
  .plank-right:hover { transform: rotate(calc(var(--tilt) * -0.5)) translateX(10px) scale(1.06); }
  .plank-left:hover { transform: rotate(calc(var(--tilt) * -0.5)) translateX(-10px) scale(1.06); }

  .carved { font-family: var(--carve-font); font-size: 2.6rem; font-weight: 700; line-height: 1; transform: scaleY(1.25);
    white-space: nowrap; letter-spacing: .1em; text-transform: uppercase; opacity: 1;
    color: transparent; background-image: var(--wood-img); background-size: 440px 84px; background-position: center;
    background-color: var(--carve-deep); background-blend-mode: multiply;
    -webkit-background-clip: text; background-clip: text;
    text-shadow: 0 1px 0 oklch(1 0 0 / 0.28), 0 -1px 0 oklch(0 0 0 / 0.6);
    filter: drop-shadow(0 -2px 1px oklch(0 0 0 / 0.55)) drop-shadow(0 1px 0 oklch(0.8 0.02 80 / 0.18));
    transition: filter .3s, background-color .3s; }
  .plank:hover .carved { background-color: oklch(0.38 0.07 60);
    filter: drop-shadow(0 -2px 1px oklch(0 0 0 / 0.6)) drop-shadow(0 1px 0 oklch(1 0.03 80 / 0.4)) drop-shadow(0 0 8px oklch(0.7 0.1 70 / 0.6)); }

  .nail { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; margin-top: -4px;
    background: radial-gradient(circle at 35% 35%, oklch(0.6 0.02 60), var(--nail) 60%, oklch(0.15 0.02 40));
    box-shadow: 0 1px 2px oklch(0 0 0 / 0.7); }
  .plank-right .nail-a { left: 23%; margin-top: -18px; } .plank-right .nail-b { left: 23%; margin-top: 10px; }
  .plank-left .nail-a { left: 75%; margin-top: -18px; } .plank-left .nail-b { left: 75%; margin-top: 10px; }

  .sound-toggle { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 10; font-family: var(--carve-font);
    font-size: 1.4rem; padding: .6rem 1rem; border-radius: 999px; background: oklch(0.2 0.02 60 / 0.7); color: var(--foreground);
    border: 1px solid oklch(1 0 0 / 0.2); backdrop-filter: blur(6px); cursor: pointer; }
  .sound-toggle:hover { background: oklch(0.3 0.04 60 / 0.85); }

  @media (max-width: 640px) {
    .plank { width: 280px; height: 64px; } .carved { font-size: 1.2rem; background-size: 280px 64px; } .signpost { left: 50%; }
    .plank-right { margin-left: 130px; } .plank-left { margin-right: 130px; }
  }
</style>
</head>
<body>
  <!-- Logo -->
  <div class="intro-overlay" id="introOverlay">
    <button id="enterButton" aria-label="Enter The Arena of Champions">
        <img
            src="assets/logo.png"
            alt="The Arena of Champions"
        >
    </button>
  </div>
  <!-- Fog video -->
  <div class="fog-container" id="fogContainer">
      <video class="fog-video" autoplay muted loop playsinline>
          <source src="assets/mist.mp4" type="video/mp4">
      </video>
  </div>
  <!-- Background video -->
  <div class="video-bg" aria-hidden="true">
    <div id="bgvideo"></div>
  </div>

  <div class="video-vignette" aria-hidden="true"></div>

  <!-- Signpost. Edit the href of each plank to point at your own pages. -->
  <div class="signpost" aria-hidden="false">
    <div class="pole" aria-hidden="true"></div>
    <div class="pole-cap" aria-hidden="true"></div>
    <a class="plank plank-right" href="library.html" style="--tilt: -3deg">
      <span class="nail nail-a"></span><span class="nail nail-b"></span>
      <span class="carved">Library</span>
    </a>
    <a class="plank plank-left" href="CharacterSheet/character_sheet.html" style="--tilt: 2deg">
      <span class="nail nail-a"></span><span class="nail nail-b"></span>
      <span class="carved">Character Creation</span>
    </a>
    <a class="plank plank-right" href="talent_tree.html" style="--tilt: 3deg">
      <span class="nail nail-a"></span><span class="nail nail-b"></span>
      <span class="carved">Talent Tree</span>
    </a>
  </div>

  <!-- <button class="sound-toggle" id="soundToggle">🔇</button> -->


<script>
    console.log("My JavaScript file loaded");

    const VIDEO_ID = "GBYpseHOcq0";

    let player;
    let entered = false;

    const enterButton = document.getElementById("enterButton");
    const intro = document.getElementById("introOverlay");
    const fog = document.getElementById("fogContainer");

    // Load the YouTube IFrame Player API.
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    console.log("YouTube API script tag reached");
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
        console.log("YouTube API is ready!");
        console.log("YT.Player type:", typeof YT.Player);

        console.log("About to create player");

        player = new YT.Player("bgvideo", {
            videoId: VIDEO_ID,
            playerVars: {
                autoplay: 1,
                mute: 1,
                loop: 1,
                playlist: VIDEO_ID,
                controls: 0,
                playsinline: 1,
                rel: 0
            },
              events: {
                onReady: function (event) {
                    console.log("Player created successfully");
                    console.log("Initial player state:", event.target.getPlayerState());

                    event.target.mute();
                    event.target.playVideo();
                },

                onStateChange: function (event) {
                    console.log("Player state changed:", event.data);
                },

                onError: function (event) {
                    console.error("YouTube player error code:", event.data);
                }
            }
        });

        console.log("Player constructor finished");
        console.log("Player object:", player);
        console.log("playVideo type:", typeof player.playVideo);
        console.log("getPlayerState type:", typeof player.getPlayerState);
    };

const fogContainer = document.getElementById("fogContainer");

  enterButton.addEventListener("click", function () {
      if (entered) return;
      entered = true;

      // Enable audio if the YouTube player is ready.
      if (player && typeof player.unMute === "function") {
          player.unMute();
          player.setVolume(100);
          player.playVideo();
      }

      // Start the scene reveal underneath the fog
      document.body.classList.add("entered");

      // Let the fog move in front of the logo
      fogContainer.classList.add("enveloping");
      enterButton.classList.add("leaving");
      console.log("Leaving class:", enterButton.className);

      // Once the logo has been swallowed, clear the fog
      setTimeout(function () {
          fogContainer.classList.remove("enveloping");
          fogContainer.classList.add("dissipating");
          intro.remove();
      }, 3000); // Match the duration of the logoFadeIntoFog animation
  });
</script>

</body>
</html>
